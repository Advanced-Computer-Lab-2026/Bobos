<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal · Logo drafts</title>
<link rel="stylesheet" href="theme-reveal.css">
<style>

*{box-sizing:border-box}body{margin:0;--paper:#faf8f4;--rail:#eee8dd;--ink:#282721;--muted:#625e54;--line:#d9d2c5;--accent:#a54a32;background:var(--paper);color:var(--ink);font:14px Styrene,Arial,sans-serif}body.dark{--paper:#242320;--rail:#302e28;--ink:#f3ece0;--muted:#c4bcad;--line:#514b40;--accent:#ed987b}main{max-width:1220px;margin:auto;padding:56px 32px 96px}header{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:34px}h1{font-size:clamp(30px,5vw,52px);letter-spacing:-.055em;margin:10px 0}p{margin:0;color:var(--muted);line-height:1.6}.index{font:12px ui-monospace,monospace;letter-spacing:.09em;color:var(--muted)}button,a{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--paper);padding:9px 13px;border-radius:6px}button:hover{background:var(--rail)}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}article{border:1px solid var(--line);border-radius:10px;overflow:hidden}article:has(button[aria-pressed="true"]){border-color:var(--accent)}.plate{display:grid;place-items:center;min-height:156px;padding:18px;--scale:1}.side{background:var(--rail);padding:14px 18px;--scale:.43;display:flex;align-items:center;justify-content:space-between;gap:10px}.side small{font-size:11px;color:var(--muted)}.caption{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px}.caption h2{font-size:13px;margin:0}.caption h2 span{color:var(--muted);margin-right:9px;font-weight:400}.caption button{font-size:12px}.caption button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}.logo{display:inline-flex;align-items:center;gap:.23em;font-weight:700;font-size:calc(53px * var(--scale));line-height:1;letter-spacing:-.065em;white-space:nowrap}.logo svg{width:1em;height:1em;flex:none}.serif{font-family:Tiempos,Georgia,serif}.caps{font-size:calc(43px * var(--scale));letter-spacing:.09em}.mono{font-family:ui-monospace,monospace;letter-spacing:-.08em;font-weight:600}.fine{font-weight:400;letter-spacing:-.075em}.case{letter-spacing:-.045em}.dot{color:var(--accent);margin-left:-.19em}.compact{font-size:calc(47px * var(--scale))}footer{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:13px 24px;display:flex;justify-content:center;gap:18px;align-items:center}footer a{font-size:12px}@media(max-width:620px){main{padding:30px 16px 48px}.grid{grid-template-columns:1fr}.plate{min-height:130px}header{margin-bottom:24px}footer{flex-wrap:wrap;gap:8px 16px}}
</style>
<main>
<header><div><div class="index">PORTAL / IDENTITY DRAFTS</div><h1>Portal logo drafts</h1><p>Compare each logo at sign-in and sidebar sizes. Folded page (09) is the logo in V7.</p></div><button id="theme" type="button">Dark preview</button></header>
<div class="grid" id="grid"></div>
</main>
<footer><span id="count" aria-live="polite">No picks yet</span><a href="02-atelier.html?page=login&amp;role=coordinator">Back to V7 sign-in</a></footer>
<script src="theme-reveal.js"></script>
<script>
const mark=(paths)=>'<svg viewBox="0 0 40 40" fill="none" aria-hidden="true">'+paths+'</svg>';
const drafts=[
['Plain type','','portal'],
['Book type','serif','portal'],
['Full stop','','portal<span class="dot">.</span>'],
['Letterspaced','caps','PORTAL'],
['Title case','case fine','Portal'],
['Mono','mono','portal'],
['Open book','compact',mark('<path d="M20 12C15 8 9 8 4 10v19c5-2 11-2 16 2 5-4 11-4 16-2V10c-5-2-11-2-16 2zm0 0v19" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>')+'portal'],
['Double loop','compact',mark('<path d="M19.5 12.5a8 8 0 1 0 0 15l5-3m-4-12 5-3a8 8 0 1 1 0 15l-5-3" stroke="currentColor" stroke-width="3" stroke-linecap="round" transform="translate(0 1.5)"/>')+'portal'],
['Folded page','serif compact',mark('<path d="M9 5h15l7 7v23H9z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M24 5v8h7M15 21h10m-10 6h7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>')+'Portal'],
['Letter block','compact',mark('<rect x="3" y="3" width="34" height="34" rx="6" fill="currentColor"/><path d="M14 30V13h7a5 5 0 0 1 0 10h-7" stroke="var(--logo-cutout,var(--paper))" stroke-width="2.8" stroke-linecap="round"/>')+'portal']
];
let picks=new Set(JSON.parse(localStorage.getItem('bobos-logo-picks')||'[]'));
const grid=document.querySelector('#grid');
for(const [i,[name,style,word]] of drafts.entries()){
 const number=String(i+1).padStart(2,'0'), logo='<span class="logo '+style+'" role="img" aria-label="Portal">'+word+'</span>';
 grid.insertAdjacentHTML('beforeend','<article><div class="plate">'+logo+'</div><div class="side" style="--logo-cutout:var(--rail)">'+logo+'<small>Sidebar</small></div><div class="caption"><h2><span class="index">'+number+'</span>'+name+'</h2><button type="button" data-pick="'+number+'" aria-label="Shortlist '+number+' '+name+'">Shortlist</button></div></article>');
}
function update(){
 for(const b of grid.querySelectorAll('button')){const selected=picks.has(b.dataset.pick);b.setAttribute('aria-pressed',selected);b.textContent=selected?'Shortlisted':'Shortlist'}
 document.querySelector('#count').textContent=picks.size?'Shortlist: '+[...picks].sort().join(', '):'No picks yet';
}
grid.addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(!b)return;const n=b.dataset.pick;picks.has(n)?picks.delete(n):picks.add(n);localStorage.setItem('bobos-logo-picks',JSON.stringify([...picks]));update()});
document.querySelector('#theme').onclick = event => {
 const button = event.currentTarget;
 revealTheme(button, () => {
  const dark = document.body.classList.toggle('dark');
  button.textContent = dark ? 'Light preview' : 'Dark preview';
  button.setAttribute('aria-pressed', dark);
 });
};
update();
</script>
</html>
