<!doctype html>
<html lang="en" data-theme="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal · Notification illustrations</title>
<link rel="icon" href="portal-card-index.svg">
<link rel="stylesheet" href="base.css">
<style>
  body {margin:0;background:#151515;color:#efeee9}
  main {max-width:1120px;margin:auto;padding:clamp(16px,3vw,36px)}
  header,nav,.settings {display:flex;align-items:center;flex-wrap:wrap;gap:8px}
  header {justify-content:space-between;margin-bottom:18px}
  h1 {margin:0;font:400 clamp(25px,3.4vw,38px)/1.12 Tiempos,Georgia,serif}
  button,select,header a {font:500 13px/1.35 Styrene,system-ui,sans-serif;color:inherit;background:#242424;border:0;border-radius:6px;padding:8px 11px;text-decoration:none}
  button {cursor:pointer}
  button[aria-pressed=true] {color:#262821;background:#d8ddce}
  button:focus-visible,select:focus-visible,a:focus-visible {outline:2px solid #a0c4ff;outline-offset:3px}
  .settings {margin:16px 0 6px;gap:12px 20px;font-size:13px;color:#bdbbb0}
  label {display:inline-flex;align-items:center;gap:7px}
  select {color:#efeee9}
  iframe {display:block;width:100%;min-height:560px;border:0;background:#151515}
</style>
<main>
  <header><h1>Notification illustrations</h1><a id="full" target="_blank" rel="noopener">Open in dashboard ↗</a></header>
  <nav aria-label="Illustration">
    <button type="button" value="tube" aria-pressed="true">Pneumatic post</button>
    <button type="button" value="pigeon" aria-pressed="false">Pigeon loft</button>
    <button type="button" value="lighthouse" aria-pressed="false">Signal coast</button>
    <button type="button" value="press" aria-pressed="false">Letterpress</button>
    <button type="button" value="line" aria-pressed="false">Print drying line</button>
  </nav>
  <div class="settings">
    <label>Inbox <select id="state"><option value="advisingStudent">Unread notices</option><option value="normalStudent">Caught up</option></select></label>
    <label>Theme <select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
    <button type="button" id="replay">Replay motion</button>
  </div>
  <iframe title="Student overview with academic calendar"></iframe>
</main>
<script>
  const frame = document.querySelector('iframe');
  const buttons = [...document.querySelectorAll('nav button')];
  const inbox = document.querySelector('#state');
  const theme = document.querySelector('#theme');
  let scene = 'tube';
  function show() {
    const url = new URL('index.html',location.href);
    url.search = new URLSearchParams({page:'overview',role:inbox.value,'notice-scene':scene,
      ...(theme.value==='dark'?{preview:'live'}:{layout:21,palette:10,mode:'light',preview:'studio'})});
    url.hash = 'student-feed';
    document.querySelector('#full').href = url;
    url.hash = '';
    url.searchParams.set('feed-only','calendar');
    frame.src = url;
    buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.value===scene)));
  }
  buttons.forEach(button=>button.onclick=()=>{scene=button.value;show()});
  inbox.onchange=theme.onchange=show;
  document.querySelector('#replay').onclick=show;
  let observer;
  frame.onload=()=>{
    observer?.disconnect();
    const content=frame.contentDocument?.querySelector('.notification-study-pair');
    if (!content) return;
    const resize=()=>{frame.style.height=Math.ceil(content.getBoundingClientRect().height+80)+'px'};
    observer=new ResizeObserver(resize);
    observer.observe(content);
    resize();
  };
  show();
</script>
</html>
