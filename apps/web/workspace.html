<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Open Portal</title>
    <script>
      const url = new URL(location.href);
      const hasDestination = ["calendar", "screen", "embedded"].some(key => url.searchParams.has(key));
      url.pathname = new URL(hasDestination ? "./academic-services.html" : "./", url).pathname;
      location.replace(url);
    </script>
  </head>
  <body><a href="./">Open Portal</a></body>
</html>
